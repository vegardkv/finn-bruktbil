[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finnbruktbil"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "selenium",
    "webdriver-manager",
    "tqdm",
    "pandas",
    "streamlit",
    "pydantic",
    "plotly",
    "scikit-learn>=1.0", # For OLS regression and metrics
    "numpy>=1.20", # For numerical computations
    "openai", # For auxiliary data parsing
    "python-dotenv", # For .env file support
    "supabase", # Cloud database
    "requests", # For Vegvesen API lookups
]

[project.scripts]
finnbruktbil = "finnbruktbil.cli:main"

[tool.setuptools]
packages = ["finnbruktbil", "finnbruktbil.cli"]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "PLR0913", "PLR2004", "C4", "RUF"]
# "×" is used intentionally in the dashboard's model-formula text.
allowed-confusables = ["×"]
